name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      # make check provisions its own Postgres via `deploy/compose.yaml`
      # (the same command a local developer runs) -- Docker is already
      # available on this runner, so no separate services: block is needed.
      - run: make check

  # The Playwright + axe suite (M4-T1): the whole core loop in a real
  # browser at three viewport widths, against the real compose stack.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose -f deploy/compose.yaml up -d --build --wait app mailpit
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e

  # PR-time proof the image still builds. The real build-and-push to
  # Artifact Registry (M0-T3's deferred half) lives in deploy.yml, which
  # owns everything past merge: push, migrate, deploy, smoke.
  docker-build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: earful:ci

  # Infra hygiene: formatting + validity of every tofu root/module, and
  # the backups module's immutability contract tests (M9-T6 AC).
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive deploy/opentofu
      - run: |
          for d in bootstrap envs/stg envs/pro; do
            (cd "deploy/opentofu/$d" \
              && tofu init -backend=false -input=false > /dev/null \
              && tofu validate)
          done
      - run: |
          cd deploy/opentofu/modules/backups
          tofu init -backend=false -input=false > /dev/null
          tofu test

  # M9-T3: a secret that reaches a commit is already leaked, so this runs
  # on every push and PR alongside GitHub's own push protection. The two
  # catch different things: push protection knows provider token shapes,
  # gitleaks knows ours.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image rather than gitleaks-action, which needs a paid licence
      # key for organisation-owned repos and would fail on licensing
      # rather than on findings. Pinned, because "latest" changing its
      # ruleset is how a scan quietly starts failing on other people's
      # false positives.
      #
      # Blocking from the first run: this exact version scanned the whole
      # history clean before the repository was first pushed, so a
      # finding here is news.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.18.4 detect \
              --source=/repo --redact --verbose --no-banner
