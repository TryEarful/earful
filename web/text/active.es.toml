# El texto de la interfaz de Earful, en español.
#
# Cada mensaje traduce el que lleva el mismo nombre en active.en.toml,
# que es el texto de referencia. Las reglas de ese archivo sobre nombres,
# marcadores como {{.Name}}, formas según la cantidad y etiquetas valen
# también aquí.
#
# Registro: usted, y un vocabulario que se lea con naturalidad tanto en
# España como en América.
#
# Cantidades: el español tiene tres formas. `one` para 1, `many` para
# los millones exactos y `other` para todo lo demás; `many` suele decir
# lo mismo que `other`.
#
# `hash` identifica el texto en inglés del que se tradujo el mensaje.
#
# Vocabulario
#
#   Survey            encuesta
#   Draft             borrador
#   Survey Version    versión
#   Answer            respuesta (lo que se contesta a una pregunta)
#   Response          envío (un formulario entregado, con todas sus respuestas)
#   Workspace         espacio de trabajo
#   Creator           creador
#   Participant       participante (quien recibe una invitación)
#   Respondent        persona encuestada
#   Anonymous Survey  encuesta anónima
#   Invited Survey    encuesta por invitación
#   Closed            cerrada
#   Transcript        transcripción
#   Localization      traducción de la encuesta
#   Insight Summary   resumen de hallazgos
#   Sign in           iniciar sesión
#   Sign-in link      enlace de acceso
#   Dictate           dictar


