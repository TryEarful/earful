empty = "No published questions yet."
question = "Question"
stopped = "Stopped here"
required = "Required"

[stats.audience]
heading = "Audience"
intro = "Totals for the whole life of the survey: these three counts keep no dates, so no date range can narrow them to a day, and a day on a small survey is a person."
browser = "Browser"
device = "Device"
country = "Country"
empty = "Nothing to show yet."

[stats.range]
aria = "Range presets"
week = "Last 7 days"
month = "Last 30 days"
all = "All time"
from = "From"
to = "To"

[stats.range.apply]
label = "Apply"

[stats.range.csv]
label = "Download CSV"


# ── Results ─────────────────────────────────────────────────────────────

[survey.responses]
one = "1 response"
other = "{{.Count}} responses"

[results]
title = "{{.Survey}} — results — Earful"
