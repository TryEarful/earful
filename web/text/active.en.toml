# ── Email ──────────────────────────────────────────────────────────────

[email.magic]
subject = "Your link to sign in to Earful"
body = '''
Click to sign in to Earful:

{{.Link}}

The link is valid for 15 minutes and can be used once. If you didn't request it, ignore this email.'''

[email.invite]
subject = "You're invited: {{.Survey}}"
body = '''
{{.Workspace}} invites you to answer the survey "{{.Survey}}".

Your personal link:

{{.Link}}

The link is yours alone and works for one submission. If you weren't expecting this, you can ignore it.'''

# Sent once the copy asked for when an account closes is built. Expires
# is a date and time in UTC.
[email.closure]
subject = "Your copy of your Earful data"
body = '''
Here is the copy of your Earful data you asked for when you closed your account:

{{.Link}}

The link downloads one archive with every survey and response your workspace held. It works for 7 days, until {{.Expires}} UTC, and then the copy is deleted.

Anyone with this link can download your data, so please don't forward this email.'''

# Sent instead, when the copy could not be built. Reason is one of the
# two sentences below.
[email.closure.failed]
subject = "Your copy of your Earful data could not be made"
body = '''
You asked for a copy of your data when you closed your Earful account, and it could not be made.

{{.Reason}}

Your data is kept for 30 days after the account closes. Within that time, support can restore your account or send you a copy.'''
generic = "Something went wrong building the archive."
large = "Your workspace is too large to send in one archive."


