# Earful's interface text, in English.
#
# Every sentence, label and message the application shows is in this
# file. English is the language the interface is written in; the other
# files (active.es.toml, …) translate what is here, message by message.
#
# Editing
#
#   Change the text to the right of the `=` and rebuild. Nothing else
#   refers to the wording, so a sentence can be rewritten freely.
#   `make text-status` then lists the translations that were made from
#   the old wording, to be read against the new.
#
# Names
#
#   A message is named for where it is and what it is for, never for
#   what it says:
#
#       [respond.submit]
#       label = "Submit answers"
#
#   is `respond.submit.label`. The name is what the templates use, so it
#   stays the same when the wording changes.
#
# Placeholders
#
#   {{.Name}} is replaced when the page is drawn. A placeholder can move
#   within its sentence; it cannot be renamed or removed.
#
# Counts
#
#   A message that depends on a number has one wording per form, and
#   {{.Count}} is the number:
#
#       [surveys.invites.send]
#       one = "Send 1 invite"
#       other = "Send {{.Count}} invites"
#
# Markup
#
#   A name ending in `_html` may contain <strong>, <em>, <a>, <code>,
#   <small> and <br>. No other message may contain a tag.
#
# Notes for translators
#
#   `description` says what a translator cannot see from the text alone.
#   A message with a note is written out in full, its text as `other`:
#
#       [voice.stop.label]
#       description = "Button. Ends a recording."
#       other = "Stop"
#
# Reserved words
#
#   The last part of a name cannot be id, description, hash, leftdelim,
#   rightdelim, zero, one, two, few, many or other: those are the fields
#   of a message. No part of a name can be `translation`.


# ── Every page ──────────────────────────────────────────────────────────

[page]
title = "{{.Title}} — Earful"

[page.home]
label = "Home"


# ── Home ────────────────────────────────────────────────────────────────

[home.intro]
body = "Open-source, AI-enhanced, voice-first surveys."

[home.sign_in]
label = "Sign in"


# ── Signing in and creating an account ──────────────────────────────────

[auth.email]
label = "Email address"

[auth.password]
label = "Password"

[login]
title = "Sign in — Earful"
heading = "Sign in"

[login.submit]
label = "Sign in"

[login.beta]
note_html = 'Earful is in private beta. Have an invite code? <a href="/signup">Create your account</a>.'

[login.magic]
hint = "No password, no account setup — the link signs you in and creates your workspace on first use."

[login.magic.submit]
label = "Email me a sign-in link"

[login.google]
divider = "or"
label = "Continue with Google"

[signup]
title = "Create account — Earful"
heading = "Create your account"
note_html = '''Earful is in private beta — an invite code creates exactly one account, and you're signed in immediately. Already have an account? <a href="/login">Sign in</a>.'''

[signup.code]
label = "Invite code"

[signup.submit]
label = "Create account"

[magic.sent]
title = "Check your email — Earful"
heading = "Check your email"
body_html = "If <strong>{{.Email}}</strong> is a valid address, a sign-in link is on its way. It works once and expires in 15 minutes."
retry_html = 'Nothing arriving? Check spam, or <a href="/login">request another link</a>.'

[magic.confirm]
title = "Confirm sign-in — Earful"
heading = "Confirm sign-in"
question_html = "Sign in to Earful as <strong>{{.Email}}</strong>?"
note = "Wasn't you? Just close this page — the link expires on its own."

[magic.confirm.submit]
label = "Sign in"

[magic.invalid]
title = "Sign-in link problem — Earful"
heading = "Sign-in link problem"

[magic.invalid.back]
label = "Back to sign-in"

[goodbye]
title = "Account deleted — Earful"
heading = "Your account is deleted"
body = "Your account and workspace are now deactivated and scheduled for permanent deletion after 30 days. If this was a mistake, contact support within those 30 days to restore it."
again = "You can create a fresh account with the same email at any time."


# ── The header of a signed-in page ──────────────────────────────────────

[header.nav]
aria = "Main"

[header.dashboard]
label = "Dashboard"

[header.account]
label = "Account"

[header.sign_out]
label = "Sign out"


# ── Dashboard ───────────────────────────────────────────────────────────

[dashboard]
title = "Dashboard — Earful"

[dashboard.new]
label = "New survey"

[dashboard.empty]
heading = "No surveys yet"
body = "Create your first survey, add questions, and publish it when it's ready."

[dashboard.survey]
anonymous = "Anonymous"
invited = "Invited"
unpublished = "· not published yet"
closes = "· closes {{.Date}}"

# One question has always been drawn as "1 questions".
[dashboard.survey.published]
one = "· version {{.Version}} · {{.Count}} questions"
other = "· version {{.Version}} · {{.Count}} questions"


# ── Account ─────────────────────────────────────────────────────────────

[account]
title = "Account — Earful"
heading = "Account"
signed_in_html = "Signed in as <strong>{{.Email}}</strong>"
workspace_html = "Workspace: <strong>{{.Workspace}}</strong>"

[account.admin.beta]
label = "Private beta admin"

[account.admin.metrics]
label = "Metrics"

[account.admin.erasure]
label = "Erasure requests"

[account.email]
heading = "Change email"
hint = "The change applies immediately — you'll sign in with the new address from now on."

[account.email.new]
label = "New email address"

[account.email.password]
label = "Current password"

[account.email.submit]
label = "Change email"

[account.export]
heading = "Export everything"
body = "Download every survey, version, question and response in this workspace — a documented JSON file plus a CSV per survey. It's the same data Earful holds, in a format you can import into your own instance."
building = "Building your export… reload this page in a moment."
selfhost_html = "Earful is AGPL-3.0 and self-hostable: <code>docker compose --profile app up</code> gives you the same application this export came from."
# Size and Built are left out when they are not known. The spaces before
# the comma and the full stop are as the page has always drawn them.
ready = "Ready {{if .Size}} ({{.Size}}) {{end}}{{if .Built}}, built {{.Built}} {{end}}. The link expires {{.Expires}}."

[account.export.download]
label = "Download the archive"

[account.export.again]
label = "Build a fresh export"

[account.export.submit]
label = "Export my workspace"

[account.delete]
heading = "Delete account"
body = "Deleting your account deactivates it immediately and permanently erases your data after 30 days. Within those 30 days, support can restore it."

[account.delete.submit]
label = "Delete my account"


# ── Documents: the trust page, the terms, help ──────────────────────────
#
# The documents themselves are Markdown, in web/pages. These are the few
# words the page puts around one.

[document]
updated = "Last updated {{.Date}}"

[document.copy]
label = "Copy as Markdown"
done = "Copied."
failed = "Couldn't copy. The link opens the Markdown instead."

[document.markdown]
label = "View as Markdown"


# ── The trail at the top of a creator's page ────────────────────────────

[breadcrumb]
aria = "Breadcrumb"
surveys = "Surveys"


# ── A survey's languages ────────────────────────────────────────────────

[languages]
title = "{{.Survey}} — languages — Earful"
heading = "Languages"
intro = "Respondents can answer in their own language. Translations are drafted for you, but nothing is published until you have read it — a machine translation going out in your name is your reputation, not the model's."

[languages.add]
heading = "Add a language"
empty = "Add questions to the survey first — there is nothing to translate yet."

[languages.add.code]
label_html = 'Language code <small class="muted">(like nl, de, pt-BR)</small>'
placeholder = "nl"

[languages.add.submit]
label = "Add language"

[languages.status]
reviewed = "Reviewed"
pending = "{{.Count}} to review"
# The spaces after the first full stop are as the page has always drawn
# them.
progress = "{{.Reviewed}} of {{.Total}} questions reviewed. {{if .Blocked}} Publishing is blocked until every one has been read.{{end}}"

[languages.draft]
label = "Draft the missing translations with AI"

[languages.remove]
label = "Remove {{.Language}}"

[languages.question]
stale = "The question changed after this was translated — read it again."
unreviewed = "Drafted by AI, not yet reviewed."

[languages.options]
label_html = 'Options <small class="muted">(one per line; leave empty to keep the originals)</small>'

[languages.save]
label = "Save and mark reviewed"
